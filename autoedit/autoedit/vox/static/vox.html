<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOX — dựng video từ ảnh</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%274%27 y=%276%27 width=%2724%27 height=%2720%27 rx=%273%27 fill=%27%232c6fc4%27/%3E%3Cpath d=%27M13 11l8 5-8 5z%27 fill=%27white%27/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f5; --panel:#fff; --line:#e6e6e6; --text:#16181c; --muted:#6c6c72;
  --accent:#2c6fc4; --accent-soft:#e8f0fb;
  --good:#16a34a; --good-soft:rgba(22,163,74,.10);
  --warn:#d97706; --warn-soft:rgba(217,119,6,.10);
  --bad:#dc2626; --bad-soft:rgba(220,38,38,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#090c12; --panel:#121826; --line:#243149; --text:#e8edf4; --muted:#8b96a8;
    --accent:#4c8fe0; --accent-soft:rgba(76,143,224,.14);
    --good:#3fae63; --good-soft:rgba(63,174,99,.14);
    --warn:#d9a94c; --warn-soft:rgba(217,169,76,.13);
    --bad:#ef4444; --bad-soft:rgba(239,68,68,.12);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#090c12; --panel:#121826; --line:#243149; --text:#e8edf4; --muted:#8b96a8;
  --accent:#4c8fe0; --accent-soft:rgba(76,143,224,.14);
  --good:#3fae63; --good-soft:rgba(63,174,99,.14);
  --warn:#d9a94c; --warn-soft:rgba(217,169,76,.13);
  --bad:#ef4444; --bad-soft:rgba(239,68,68,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
     font:14px/1.5 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
header{background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:12px;padding:10px 16px}
.logo{font-weight:800;letter-spacing:.02em}
.logo span{color:var(--muted);font-weight:600}
#ai{margin-left:auto;color:var(--muted);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:16px;
  max-width:1400px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.khoi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:14px;margin:0 0 10px;font-weight:700}
.goi-y{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.chon{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:0 0 12px;font-size:13px}
.chon label{color:var(--muted);margin-right:6px}
.chon select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}

/* ── ô ảnh trong chuỗi ── */
.anh{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;align-items:start;
  border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--bg);margin-bottom:10px}
@media (max-width:520px){.anh{grid-template-columns:1fr}}
.tha{position:relative;aspect-ratio:16/9;border:1.5px dashed var(--line);border-radius:7px;display:flex;
  align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12.5px;
  cursor:pointer;overflow:hidden;background:var(--panel)}
.tha:hover,.tha.keo{border-color:var(--accent);color:var(--accent)}
.tha img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.so{position:absolute;top:6px;left:6px;z-index:1;background:rgba(0,0,0,.6);color:#fff;font-weight:700;
  font-size:11px;border-radius:5px;padding:1px 7px}
.truong{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;font-size:13px}
.truong label{color:var(--muted)}
.truong input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:110px}
.bo{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12.5px;padding:2px 0;justify-self:start}
.bo:hover{color:var(--bad)}
.hang{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.nut{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:8px 16px;font-weight:700;cursor:pointer}
.nut:disabled{opacity:.45;cursor:not-allowed}
.nut.phu{background:var(--panel);color:var(--text);border:1px solid var(--line);font-weight:600}
.nut.nho{padding:5px 11px;font-size:13px}
#tong{color:var(--muted);font-size:13px}
#bao{font-size:13px}
#bao.loi{color:var(--bad)}

/* ── việc đã gửi ── */
.viec{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:10px;background:var(--bg)}
.dau{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.tt{font-weight:700;border-radius:5px;padding:1px 8px;font-size:12px}
.tt.cho,.tt.dang{background:var(--accent-soft);color:var(--accent)}
.tt.xong{background:var(--good-soft);color:var(--good)}
.tt.hong{background:var(--bad-soft);color:var(--bad)}
.mo{color:var(--muted);font-size:12px}
.nho-anh{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.nho-anh img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
video{width:100%;border-radius:7px;background:#000;display:block}
.tai{display:inline-block;margin-top:6px;font-size:13px;color:var(--accent);font-weight:600;text-decoration:none}
.loi-viec{color:var(--bad);font-size:12.5px;margin-top:4px;word-break:break-word}
.trong{color:var(--muted);font-size:13px}

/* ── hộp chọn lớp ── */
#hop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;
  padding:16px;z-index:10}
#hop.mo{display:flex}
#hop .khoi{max-width:1000px;width:100%;max-height:100%;overflow:auto}
#san{position:relative;display:inline-block;max-width:100%;cursor:crosshair;user-select:none;touch-action:none}
#san img{display:block;max-width:100%;max-height:60vh;border-radius:6px;pointer-events:none}
.ve{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);pointer-events:none}
#dsLop{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lop{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 8px;
  font-size:12.5px;background:var(--bg)}
.lop button{background:none;border:none;cursor:pointer;color:var(--muted);padding:0 4px}
.lop button:hover{color:var(--bad)}
#baoLop{font-size:13px;color:var(--muted)}
#san.psd{cursor:default}
.canh-bao{color:var(--bad);background:var(--bad-soft);font-size:13px;font-weight:600;margin:0 0 8px;
  line-height:1.45;border-radius:6px;padding:6px 10px}
.anh > .canh-bao{grid-column:1/-1;margin:0}
.o-psd{position:absolute;border:2px solid var(--accent);background:rgba(80,140,255,.15);pointer-events:none;border-radius:3px}
.khoi-psd{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;
  font-size:12.5px;background:var(--bg);cursor:pointer}
.khoi-psd img{width:48px;height:32px;object-fit:contain;border-radius:3px;
  background:repeating-conic-gradient(#777 0 25%,#aaa 0 50%) 0 0/10px 10px}
.khoi-psd.an{opacity:.5;cursor:not-allowed}
#baoLop.loi{color:var(--bad)}
</style>
</head>
<body>
<header>
  <div class="logo">VOX <span>· dựng video chuyển động từ ảnh</span></div>
  <div id="ai"></div>
</header>
<main>
  <section class="khoi">
    <h2>Video mới</h2>
    <p class="goi-y">Thả 1–3 ảnh (PNG, JPG hoặc PSD đã chia layer) theo thứ tự, nhập số giây cho từng ảnh, chọn lớp
      cho từng ảnh. Máy tự lên nhịp, camera và cú nối giữa các ảnh.</p>
    <div class="chon">
      <span><label for="khungVid">Khung</label><select id="khungVid"></select></span>
      <span><label for="style">Style</label><select id="style"></select></span>
    </div>
    <div id="chuoi"></div>
    <div class="hang">
      <button class="nut phu" id="them" type="button">+ Thêm ảnh</button>
      <span id="tong"></span>
    </div>
    <div class="hang">
      <button class="nut" id="dung" type="button" disabled>Dựng video</button>
      <span id="bao"></span>
    </div>
    <input type="file" id="chon" accept="image/png,image/jpeg,image/webp,.psd,image/vnd.adobe.photoshop" hidden>
  </section>
  <section class="khoi">
    <h2>Video của tôi</h2>
    <div id="ds"><p class="trong">Đang tải…</p></div>
  </section>
</main>

<div id="hop" role="dialog" aria-modal="true">
  <div class="khoi">
    <h2>Chọn lớp — ảnh <span id="hopSo"></span></h2>
    <p class="goi-y" id="goiYLop"></p>
    <div class="hang" style="margin:0 0 10px">
      <button class="nut phu nho" id="nutDeXuat" type="button">Máy đề xuất</button>
      <button class="nut phu nho" id="nutXoaHet" type="button">Xoá hết</button>
      <button class="nut nho" id="nutXong" type="button">Xong</button>
      <span id="baoLop"></span>
    </div>
    <p id="baoNen" class="canh-bao" hidden></p>
    <div id="san"><img id="xemLop" alt="ảnh chọn lớp"></div>
    <div id="dsLop"></div>
  </div>
</div>

<script>
"use strict";
var BANG = null, DUNG_DUOC = false, CHUOI = [], VIEC = [], HEN = null;
var KHUNG_TAY = false;            /* người đã chọn khung bằng tay -> không tự đổi theo ảnh nữa */
var LOP = null;                   /* hộp chọn lớp đang mở: {i, khung_lop, lan} */
var TI_LE = {"16:9": 16 / 9, "4:5": 4 / 5, "9:16": 9 / 16};
var GOI_Y_KHUNG = "Giữ chuột và KÉO một khung quanh từng thứ muốn chuyển động riêng (chữ, người, toà nhà…). " +
  "Máy cắt đúng đường viền bên trong khung và tô màu để anh/chị xem. Không chọn lớp nào thì cả ảnh chuyển động theo chiều sâu.";
var GOI_Y_PSD = "Tick từng khối (layer / nhóm ngoài cùng của PSD) muốn chuyển động riêng — dùng thẳng layer team đã cắt. " +
  "Khối không tick ghép lại thành nền, nên phải chừa ít nhất một khối làm nền.";

async function api(duong, cach, than){
  var o = {method: cach || "GET", headers: {}};
  if(than instanceof FormData){ o.body = than; }
  else if(than !== undefined){ o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(than); }
  var r = await fetch(duong, o);
  var t = await r.text();
  var j = null; try { j = t ? JSON.parse(t) : null; } catch(e){ j = t; }
  if(!r.ok) throw new Error((j && j.detail) ? (typeof j.detail === "string" ? j.detail : "Dữ liệu hỏng") : ("Lỗi " + r.status));
  return j;
}
function el(the, lop, chu){
  var e = document.createElement(the);
  if(lop) e.className = lop;
  if(chu !== undefined) e.textContent = chu;
  return e;
}
function giay(x){ return (Math.round(x * 10) / 10).toString().replace(".", ","); }
function khung(){ return document.getElementById("khungVid").value; }

/* ═══════════ chuỗi ảnh ═══════════ */
function oMoi(){ return {tep: null, url: "", giay: 4, khung_lop: [], psd: null, psd_lop: [], dangDoc: false}; }
/* khối đang chọn mà layer nền PSD vẫn còn bản sao (máy chủ so điểm ảnh) — user chốt 08/10: team tự xoá */
function khoiConSao(o, chon){
  if(!o.psd || !o.psd.con_trong_nen) return [];
  chon = chon || o.psd_lop;
  return o.psd.lop.filter(function(x){ return o.psd.con_trong_nen.indexOf(x.chi_so) >= 0 && chon.indexOf(x.chi_so) >= 0; });
}
function laPsd(tep){ return /\.psd$/i.test(tep.name) || tep.type === "image/vnd.adobe.photoshop"; }

function veChuoi(){
  var g = document.getElementById("chuoi");
  g.textContent = "";
  CHUOI.forEach(function(o, i){
    var hop = el("div", "anh");
    var sao = khoiConSao(o);                       /* user báo 08/10: cảnh báo nhỏ dưới ô bị lướt qua -> đỏ, TRÊN ô */
    if(sao.length) hop.appendChild(el("p", "canh-bao", "⚠ Nền PSD còn chứa " + sao.length + " khối đang chọn (" +
      sao.map(function(x){ return x.ten; }).join(", ") + ") — video sẽ lộ 2 bản. Xoá chúng khỏi layer nền trong " +
      "Photoshop rồi thả lại file."));
    var tha = el("div", "tha");
    tha.appendChild(el("span", "so", "Ảnh " + (i + 1)));
    if(o.url){ var im = el("img"); im.src = o.url; im.alt = "ảnh " + (i + 1); tha.appendChild(im); }
    else tha.appendChild(el("span", "", o.dangDoc ? "Đang đọc PSD…" : "Bấm để chọn ảnh hoặc kéo thả vào đây"));
    tha.onclick = function(){ moChon(i); };
    tha.ondragover = function(e){ e.preventDefault(); tha.classList.add("keo"); };
    tha.ondragleave = function(){ tha.classList.remove("keo"); };
    tha.ondrop = function(e){
      e.preventDefault(); tha.classList.remove("keo");
      if(e.dataTransfer.files.length) datTep(i, e.dataTransfer.files[0]);
    };
    hop.appendChild(tha);
    var t = el("div", "truong");
    t.appendChild(el("label", "", "Giây"));
    var gi = el("input"); gi.type = "number"; gi.min = "0.5"; gi.max = "60"; gi.step = "0.1"; gi.value = o.giay;
    gi.oninput = function(){ o.giay = parseFloat(gi.value) || 0; capNhat(); };
    t.appendChild(gi);
    t.appendChild(el("label", "", "Lớp"));
    var dong = el("span");
    var so = o.psd ? o.psd_lop.length : o.khung_lop.length;
    dong.appendChild(el("span", "so-lop", (so ? so + " lớp" : "chưa chọn") + (o.psd ? " · PSD  " : "  ")));
    var nl = el("button", "nut phu nho chon-lop", "Chọn lớp"); nl.type = "button"; nl.disabled = !o.tep || o.dangDoc;
    nl.onclick = function(){ moLop(i); };
    dong.appendChild(nl);
    t.appendChild(dong);
    if(CHUOI.length > 1){
      t.appendChild(el("span"));
      var b = el("button", "bo", "✕ Bỏ ảnh này"); b.type = "button";
      b.onclick = function(){ boAnh(i); };
      t.appendChild(b);
    }
    hop.appendChild(t);
    g.appendChild(hop);
  });
  capNhat();
}
var DANG_CHON = 0;
function moChon(i){ DANG_CHON = i; var c = document.getElementById("chon"); c.value = ""; c.click(); }
async function datTep(i, tep){
  var psd = laPsd(tep);
  if(!psd && !/^image\/(png|jpeg|webp)$/.test(tep.type)){ bao("Chỉ nhận ảnh PNG, JPG, WEBP hoặc file PSD.", true); return; }
  var o = CHUOI[i];
  if(o.url) URL.revokeObjectURL(o.url);
  o.tep = tep; o.url = ""; o.khung_lop = []; o.psd = null; o.psd_lop = [];
  bao("");
  if(psd){
    /* trình duyệt không xem được PSD: máy chủ đọc layer + trả ảnh xem + khối tick sẵn */
    o.dangDoc = true; veChuoi();
    try {
      var fd = new FormData(); fd.append("anh", tep, tep.name);
      var j = await api("/api/psd", "POST", fd);
      if(o.tep !== tep) return;                                   /* đã đổi ảnh khác trong lúc đọc */
      o.psd = j; o.psd_lop = j.de_xuat.slice(); o.url = j.xem;
    } catch(e){ if(o.tep === tep){ o.tep = null; bao(e.message, true); } }
    o.dangDoc = false;
    veChuoi();
    if(i === 0 && !KHUNG_TAY && o.psd) datKhung(khungGan(o.psd.rong / o.psd.cao));
    return;
  }
  o.url = URL.createObjectURL(tep);
  veChuoi();
  if(i === 0 && !KHUNG_TAY){
    var im = new Image();
    im.onload = function(){ datKhung(khungGan(im.naturalWidth / im.naturalHeight)); };
    im.src = CHUOI[0].url;
  }
}
function khungGan(tl){
  var tot = "16:9";
  Object.keys(TI_LE).forEach(function(k){
    if(Math.abs(Math.log(tl / TI_LE[k])) < Math.abs(Math.log(tl / TI_LE[tot]))) tot = k;
  });
  return tot;
}
function datKhung(k){
  var s = document.getElementById("khungVid");
  if(s.value === k) return;
  s.value = k; doiKhung();
}
function doiKhung(){
  /* khung lớp tính trên ảnh ĐÃ CẮT khung hình: đổi khung hình thì khung lớp cũ không còn đúng chỗ */
  var co = CHUOI.some(function(o){ return o.khung_lop.length; });
  CHUOI.forEach(function(o){ o.khung_lop = []; });
  if(co) bao("Đổi khung hình nên lớp đã chọn được xoá — chọn lại lớp cho từng ảnh.", true);
  veChuoi();
}
function boAnh(i){
  if(CHUOI[i].url) URL.revokeObjectURL(CHUOI[i].url);
  CHUOI.splice(i, 1);
  veChuoi();
}
function capNhat(){
  var tong = CHUOI.reduce(function(a, o){ return a + (o.giay || 0); }, 0);
  document.getElementById("tong").textContent = CHUOI.length + " ảnh · tổng " + giay(tong) + " giây";
  document.getElementById("them").hidden = CHUOI.length >= BANG.toi_da_anh;
  var du = CHUOI.every(function(o){ return o.tep && !o.dangDoc && o.giay >= 0.5 && o.giay <= 60; });
  document.getElementById("dung").disabled = !DUNG_DUOC || !du;
}
function bao(chu, loi){ var b = document.getElementById("bao"); b.textContent = chu; b.className = loi ? "loi" : ""; }

async function dung(){
  var sao = CHUOI.map(function(o, i){
    var k = khoiConSao(o);
    return k.length ? "ảnh " + (i + 1) + ": " + k.map(function(x){ return x.ten; }).join(", ") : "";
  }).filter(Boolean);
  if(sao.length && !window.confirm("Nền PSD còn chứa khối đang chọn (" + sao.join("; ") + ") — khối sẽ bay đè lên " +
    "chính nó, video lộ 2 bản. Vẫn dựng?")) return;
  var n = document.getElementById("dung");
  n.disabled = true; bao("Đang gửi…");
  var fd = new FormData();
  CHUOI.forEach(function(o){ fd.append("anh", o.tep, o.tep.name); });
  fd.append("cau_hinh", JSON.stringify({
    anh: CHUOI.map(function(o){ return {giay: o.giay, khung_lop: o.khung_lop, psd_lop: o.psd ? o.psd_lop : []}; }),
    khung: khung(), style: document.getElementById("style").value}));
  try {
    await api("/api/viec", "POST", fd);
    bao("Đã xếp hàng. Video hiện ở cột bên phải khi dựng xong.");
    CHUOI.forEach(function(o){ if(o.url) URL.revokeObjectURL(o.url); });
    CHUOI = [oMoi()]; KHUNG_TAY = false;
    veChuoi();
    napViec();
  } catch(e){ bao(e.message, true); capNhat(); }
}

/* ═══════════ hộp chọn lớp ═══════════ */
function anhCatKhung(url, k){
  /* cắt GIỮA đúng tỉ lệ khung hình — như máy chủ cắt lúc dựng */
  return new Promise(function(xong){
    var im = new Image();
    im.onload = function(){
      var w = im.naturalWidth, h = im.naturalHeight, tl = TI_LE[k], cw = w, ch = h, x = 0, y = 0;
      if(w / h > tl){ cw = Math.round(h * tl); x = Math.floor((w - cw) / 2); }
      else { ch = Math.round(w / tl); y = Math.floor((h - ch) / 2); }
      var s = Math.min(1, 1200 / cw), c = document.createElement("canvas");
      c.width = Math.round(cw * s); c.height = Math.round(ch * s);
      c.getContext("2d").drawImage(im, x, y, cw, ch, 0, 0, c.width, c.height);
      xong(c.toDataURL("image/jpeg", 0.9));
    };
    im.src = url;
  });
}
async function moLop(i){
  if(CHUOI[i].psd) return moLopPsd(i);
  LOP = {i: i, khung_lop: CHUOI[i].khung_lop.slice(), lan: 0};
  document.getElementById("goiYLop").textContent = GOI_Y_KHUNG;
  document.getElementById("baoNen").hidden = true;
  document.getElementById("san").classList.remove("psd");
  document.getElementById("hopSo").textContent = i + 1;
  document.getElementById("xemLop").src = await anhCatKhung(CHUOI[i].url, khung());
  baoLop("");
  veLop();
  document.getElementById("hop").classList.add("mo");
  if(LOP.khung_lop.length) xemCat(false);
}
function baoLop(chu, loi){ var b = document.getElementById("baoLop"); b.textContent = chu; b.className = loi ? "loi" : ""; }
function veLop(){
  var d = document.getElementById("dsLop");
  d.textContent = "";
  if(!LOP.khung_lop.length){ d.appendChild(el("span", "trong", "Chưa có lớp nào.")); return; }
  LOP.khung_lop.forEach(function(k, j){
    var c = el("span", "lop", "Lớp " + (j + 1));
    var x = el("button", "", "✕"); x.type = "button"; x.title = "Bỏ lớp này";
    x.onclick = function(){ LOP.khung_lop.splice(j, 1); veLop(); xemCat(false); };
    c.appendChild(x);
    d.appendChild(c);
  });
}
async function xemCat(deXuat){
  var o = CHUOI[LOP.i], lan = ++LOP.lan;
  var fd = new FormData();
  fd.append("anh", o.tep, o.tep.name);
  fd.append("khung", khung());
  fd.append("khung_lop", JSON.stringify(LOP.khung_lop));
  fd.append("de_xuat", deXuat ? "1" : "");
  baoLop(deXuat ? "Máy đang tìm vật… (lần đầu có thể mất nửa phút)" : "Đang cắt…");
  try {
    var j = await api("/api/lop", "POST", fd);
    if(!LOP || lan !== LOP.lan) return;                       /* đã có lượt mới hơn */
    LOP.khung_lop = j.khung_lop;
    document.getElementById("xemLop").src = j.xem;
    veLop();
    baoLop(deXuat && !j.khung_lop.length ? "Máy không tìm được vật nào — kéo khung bằng tay." : "");
  } catch(e){ if(LOP && lan === LOP.lan) baoLop(e.message, true); }
}
/* PSD: tick khối layer — KHÔNG kéo khung, không máy cắt (user chốt 08/10) */
async function moLopPsd(i){
  var o = CHUOI[i];
  LOP = {i: i, psd: true, chon: o.psd_lop.slice()};
  document.getElementById("hopSo").textContent = i + 1;
  document.getElementById("goiYLop").textContent = GOI_Y_PSD;
  document.getElementById("san").classList.add("psd");
  xoaOPsd();
  document.getElementById("xemLop").src = await anhCatKhung(o.url, khung());
  baoLop("");
  veLopPsd();
  document.getElementById("hop").classList.add("mo");
}
function xoaOPsd(){
  Array.prototype.slice.call(document.querySelectorAll("#san .o-psd")).forEach(function(e){ e.remove(); });
}
function hopPsd(x){
  /* hộp khối trên canvas PSD -> tỉ lệ trong ảnh đã cắt GIỮA đúng khung hình (như máy chủ cắt lúc dựng) */
  var p = CHUOI[LOP.i].psd, w = p.rong, h = p.cao, tl = TI_LE[khung()], cw = w, ch = h, x0 = 0, y0 = 0;
  if(w / h > tl){ cw = Math.round(h * tl); x0 = Math.floor((w - cw) / 2); }
  else { ch = Math.round(w / tl); y0 = Math.floor((h - ch) / 2); }
  function k(v){ return Math.min(1, Math.max(0, v)); }
  return [k((x.hop[0] - x0) / cw), k((x.hop[1] - y0) / ch), k((x.hop[2] - x0) / cw), k((x.hop[3] - y0) / ch)];
}
function veLopPsd(){
  var o = CHUOI[LOP.i], d = document.getElementById("dsLop"), san = document.getElementById("san");
  var im = document.getElementById("xemLop");
  var sao = khoiConSao(o, LOP.chon), bn = document.getElementById("baoNen");
  bn.hidden = !sao.length;
  bn.textContent = sao.length ? "⚠ Nền PSD vẫn còn: " + sao.map(function(x){ return x.ten; }).join(", ") +
    ". Khi các khối này bay đi, video sẽ lộ 2 bản — xoá chúng khỏi layer nền trong Photoshop " +
    "(Content-Aware Fill) rồi thả lại file." : "";
  d.textContent = "";
  o.psd.lop.forEach(function(x){
    var dong = el("label", "khoi-psd" + (x.hien ? "" : " an"));
    var cb = el("input"); cb.type = "checkbox"; cb.checked = LOP.chon.indexOf(x.chi_so) >= 0; cb.disabled = !x.hien;
    cb.onchange = function(){ doiKhoiPsd(x.chi_so, cb.checked); };
    dong.appendChild(cb);
    if(x.nho){ var t = el("img"); t.src = x.nho; t.alt = ""; dong.appendChild(t); }
    dong.appendChild(el("span", "", x.ten + (x.hien ? "" : " (đang ẩn)")));
    d.appendChild(dong);
  });
  function dat(){
    xoaOPsd();
    var r = im.getBoundingClientRect(), sr = san.getBoundingClientRect();
    o.psd.lop.forEach(function(x){
      if(LOP.chon.indexOf(x.chi_so) < 0) return;
      var k = hopPsd(x), b = el("div", "o-psd");
      b.style.left = (r.left - sr.left + k[0] * r.width) + "px"; b.style.top = (r.top - sr.top + k[1] * r.height) + "px";
      b.style.width = (k[2] - k[0]) * r.width + "px"; b.style.height = (k[3] - k[1]) * r.height + "px";
      san.appendChild(b);
    });
  }
  if(im.complete && im.naturalWidth) dat(); else im.onload = function(){ im.onload = null; dat(); };
}
function doiKhoiPsd(c, co){
  var lop = CHUOI[LOP.i].psd.lop, chon = LOP.chon.filter(function(v){ return v !== c; });
  if(co){
    if(chon.length >= BANG.toi_da_lop){ baoLop("Tối đa " + BANG.toi_da_lop + " lớp mỗi ảnh.", true); veLopPsd(); return; }
    var conNen = lop.some(function(x){ return x.hien && x.chi_so !== c && chon.indexOf(x.chi_so) < 0; });
    if(!conNen){ baoLop("Phải chừa ít nhất một khối đang hiện làm nền.", true); veLopPsd(); return; }
    chon.push(c); chon.sort(function(a, b){ return a - b; });
  }
  LOP.chon = chon; baoLop(""); veLopPsd();
}
function xongLop(){
  if(!LOP) return;
  if(LOP.psd){ CHUOI[LOP.i].psd_lop = LOP.chon; xoaOPsd(); }
  else CHUOI[LOP.i].khung_lop = LOP.khung_lop;
  document.getElementById("hop").classList.remove("mo");
  LOP = null;
  veChuoi();
}
function ganKeoKhung(){
  var san = document.getElementById("san"), bd = null, ve = null;
  function viTri(e){
    var r = document.getElementById("xemLop").getBoundingClientRect();
    return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)), r];
  }
  san.addEventListener("pointerdown", function(e){
    if(!LOP || LOP.psd || e.button !== 0) return;
    e.preventDefault();
    bd = viTri(e);
    ve = el("div", "ve"); san.appendChild(ve);
    san.setPointerCapture(e.pointerId);
  });
  san.addEventListener("pointermove", function(e){
    if(!bd) return;
    var p = viTri(e), r = p[2], ir = san.getBoundingClientRect();
    var x0 = Math.min(bd[0], p[0]), y0 = Math.min(bd[1], p[1]);
    ve.style.left = (x0 * r.width + r.left - ir.left) + "px"; ve.style.top = (y0 * r.height + r.top - ir.top) + "px";
    ve.style.width = Math.abs(p[0] - bd[0]) * r.width + "px"; ve.style.height = Math.abs(p[1] - bd[1]) * r.height + "px";
  });
  san.addEventListener("pointerup", function(e){
    if(!bd) return;
    var p = viTri(e), k = [Math.min(bd[0], p[0]), Math.min(bd[1], p[1]), Math.max(bd[0], p[0]), Math.max(bd[1], p[1])];
    bd = null; if(ve){ ve.remove(); ve = null; }
    if(k[2] - k[0] < 0.01 || k[3] - k[1] < 0.01) return;    /* bấm nhầm, không kéo */
    if(LOP.khung_lop.length >= BANG.toi_da_lop){ baoLop("Tối đa " + BANG.toi_da_lop + " lớp mỗi ảnh.", true); return; }
    LOP.khung_lop.push(k.map(function(v){ return Math.round(v * 1e4) / 1e4; }));
    veLop(); xemCat(false);
  });
}

/* ═══════════ việc đã gửi ═══════════ */
function nhanTT(v){
  if(v.trang_thai === "cho") return ["cho", "⟳ chờ · thứ " + v.thu_tu];
  if(v.trang_thai === "dang"){
    var s = v.bat_dau ? Math.round(Date.now() / 1000 - v.bat_dau) : 0;
    return ["dang", "⟳ đang dựng · " + Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2)];
  }
  if(v.trang_thai === "xong") return ["xong", "✓ xong"];
  return ["hong", "✕ hỏng"];
}
function veViec(){
  var g = document.getElementById("ds");
  g.textContent = "";
  if(!VIEC.length){ g.appendChild(el("p", "trong", "Chưa có video nào.")); return; }
  VIEC.forEach(function(v){
    var h = el("div", "viec");
    var d = el("div", "dau");
    var tt = nhanTT(v);
    d.appendChild(el("span", "tt " + tt[0], tt[1]));
    d.appendChild(el("span", "mo", [v.style, v.anh.length + " ảnh", giay(v.giay) + " s", v.khung,
      new Date(v.tao * 1000).toLocaleString("vi-VN", {hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit"})]
      .filter(Boolean).join(" · ")));
    h.appendChild(d);
    var nho = el("div", "nho-anh");
    v.anh.forEach(function(a, i){
      var im = el("img"); im.loading = "lazy"; im.alt = "ảnh " + (i + 1);
      im.src = "/api/viec/" + v.id + "/anh/" + i;
      im.title = giay(a.giay) + " s · " + a.so_lop + " lớp";
      nho.appendChild(im);
    });
    h.appendChild(nho);
    if(v.trang_thai === "xong"){
      var vd = el("video"); vd.controls = true; vd.preload = "metadata";
      vd.src = "/api/viec/" + v.id + "/video";
      h.appendChild(vd);
      var t = el("a", "tai", "↓ Tải MP4"); t.href = "/api/viec/" + v.id + "/video"; t.download = "vox_" + v.id + ".mp4";
      h.appendChild(t);
    }
    if(v.trang_thai === "hong") h.appendChild(el("div", "loi-viec", v.loi));
    g.appendChild(h);
  });
}
var DAU_VIEC = "";
async function napViec(){
  clearTimeout(HEN);
  try {
    var j = await api("/api/viec");
    var dau = JSON.stringify(j.viec.map(function(v){ return [v.id, v.trang_thai, v.thu_tu]; }));
    VIEC = j.viec;
    if(dau !== DAU_VIEC){ DAU_VIEC = dau; veViec(); }
    else document.querySelectorAll(".viec .tt.dang").forEach(function(e, k){
      var v = VIEC.filter(function(x){ return x.trang_thai === "dang"; })[k];
      if(v) e.textContent = nhanTT(v)[1];
    });
  } catch(e){
    var g = document.getElementById("ds");
    g.textContent = ""; g.appendChild(el("p", "loi-viec", e.message));
  }
  var con = VIEC.some(function(v){ return v.trang_thai === "cho" || v.trang_thai === "dang"; });
  HEN = setTimeout(napViec, con ? 3000 : 20000);
}

/* ═══════════ khởi động ═══════════ */
async function batDau(){
  BANG = await api("/api/bang");
  try {
    var toi = await api("/api/toi");
    DUNG_DUOC = !!toi.dung_duoc;
    document.getElementById("ai").textContent = toi.nguoi
      ? toi.nguoi + (DUNG_DUOC ? "" : " · chỉ xem (chưa có quyền dựng)") : "chưa đăng nhập — mở qua cổng 9000";
  } catch(e){}
  var kh = document.getElementById("khungVid");
  Object.keys(BANG.khung).forEach(function(k){ var o = el("option", "", BANG.khung[k]); o.value = k; kh.appendChild(o); });
  kh.value = "16:9";
  kh.onchange = function(){ KHUNG_TAY = true; doiKhung(); };
  var st = document.getElementById("style");
  Object.keys(BANG.style).forEach(function(k){ var o = el("option", "", BANG.style[k]); o.value = k; st.appendChild(o); });
  CHUOI = [oMoi()];
  veChuoi();
  document.getElementById("them").onclick = function(){
    if(CHUOI.length >= BANG.toi_da_anh) return;
    CHUOI.push(oMoi()); veChuoi();
  };
  document.getElementById("chon").onchange = function(e){ if(e.target.files.length) datTep(DANG_CHON, e.target.files[0]); };
  document.getElementById("dung").onclick = dung;
  document.getElementById("nutDeXuat").onclick = function(){
    if(LOP && LOP.psd){ LOP.chon = CHUOI[LOP.i].psd.de_xuat.slice(); baoLop(""); veLopPsd(); } else xemCat(true);
  };
  document.getElementById("nutXoaHet").onclick = function(){
    if(LOP && LOP.psd){ LOP.chon = []; baoLop(""); veLopPsd(); } else { LOP.khung_lop = []; veLop(); xemCat(false); }
  };
  document.getElementById("nutXong").onclick = xongLop;
  ganKeoKhung();
  napViec();
}
batDau();
