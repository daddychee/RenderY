<!doctype html><html><head><meta charset="utf-8"><style>
/* ═══ token theo RADARY (chuẩn sống CRM OUTLIERY) — mockup duyệt 04/09 ở
   static/mockup_de_xuat.html (mở /mockup): UI này phải khớp mockup từng khối.
   Riêng tab Processing theo mockup duyệt 05/09 ở static/mockup_processing.html
   (mở /mockup-processing): lưới 2 cột trái=đang chạy phải=chờ, lịch sử gộp ngày ═══ */
:root{
  color-scheme:light;
  --bg:#f5f5f5; --panel:#fff; --line:#e6e6e6; --text:#16181c; --muted:#6c6c72;
  --accent:#2c6fc4; --accent-soft:#e8f0fb;
  --good:#16a34a; --good-soft:rgba(22,163,74,.10);
  --warn:#d97706; --warn-soft:rgba(217,119,6,.10);
  --bad:#dc2626; --bad-soft:rgba(220,38,38,.08);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#090c12; --panel:#121826; --line:#243149; --text:#e8edf4; --muted:#8b96a8;
  --accent:#4c8fe0; --accent-soft:rgba(76,143,224,.14);
  --good:#3fae63; --good-soft:rgba(63,174,99,.14);
  --warn:#d9a94c; --warn-soft:rgba(217,169,76,.13);
  --bad:#ef4444; --bad-soft:rgba(239,68,68,.12);
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);
  font:14px/1.5 'Inter',-apple-system,'Segoe UI',Roboto,sans-serif}
/* FULL MÀN HÌNH (user 08/09: đây là ứng dụng dựng video) — bỏ cột 1180px.
   Nội dung dạng ĐỌC (form nộp, cài đặt) vẫn kẹp bề rộng dễ đọc bằng .hep;
   màn dựng (Offline) và lưới (Library) ăn trọn bề ngang. */
html,body{height:100%}
#app{width:100%;max-width:none;margin:0;padding:12px 18px 16px}
body.dung-video{overflow:hidden}                 /* màn Offline: không cuộn trang */
.hep{max-width:1180px;margin:0 auto}
/* 1 HÀNG duy nhất (08/09): logo + tab + người dùng — không xuống dòng, không
   chồng với header CRM phía trên; app nằm trong iframe CRM nên header phải mỏng */
header.top{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;
  padding:2px 0 10px;min-height:38px}
header.top .ai{margin-left:auto;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:34vw;font-size:12px}
/* TRONG CRM: CRM đã có thanh tiêu đề riêng (logo + ngày + người dùng) — tool
   ẩn phần trùng, chỉ giữ NAV (user báo trùng lặp navigator 08/09) */
body.trong-crm header.top h1{display:none}
body.trong-crm header.top .ai{display:none}
body.trong-crm header.top{padding:0 0 8px;min-height:32px}
header.top h1{font-size:17px;flex:0 0 auto;font-family:'Space Grotesk',sans-serif;letter-spacing:-.035em}
header.top h1 span{color:var(--accent)}
nav.tabs{display:flex;gap:4px;flex-wrap:nowrap;align-items:center;flex:1 1 auto;min-width:0}
nav.tabs button{border:0;background:none;color:var(--muted);padding:7px 13px;
  border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;font-family:inherit}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
nav.tabs button:disabled{opacity:.4;cursor:default}
nav.tabs button:focus-visible{outline:2px solid var(--accent)}
.ai{margin-left:auto;color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin-bottom:14px}
.panel h2{font-size:15px;margin-bottom:10px}
.panel h2 small{color:var(--muted);font-weight:400;font-size:12.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.chip b{display:block;font-size:17px}
.chip b.w{color:var(--warn)}
.chip span{color:var(--muted);font-size:12px}
/* ── OFFLINE (Đợt 4 — UI 2 pha chốt 07/09) ── */
#man-offline.on{display:flex; flex-direction:column; gap:10px;
                height:calc(100vh - 78px); min-height:520px}
#man-offline .panel{flex:0 0 auto}
/* 4 KHỐI VUÔNG (user 08/09): PREVIEW to nhất chiếm cột trái trọn chiều cao;
   REF · ENVATO · STOCK xếp bên phải */
/* 4 KHỐI NẰM NGANG (user 08/09): PREVIEW to nhất | REF | ENVATO | STOCK */
#of-than{display:grid; gap:12px; flex:1 1 0; min-height:0;
         grid-template-columns:minmax(0, 2fr) minmax(0, 3fr);
         grid-template-rows:minmax(0, 1fr)}
#of-trai{min-height:0; display:flex; flex-direction:column}
#of-phai{display:contents}          /* khay thành ô phải của lưới cha */

/* 2 MÀN 50/50 (user 08/09): trên review+trim footage, dưới preview timeline */
.of-man{flex:1 1 100%; min-height:0; display:flex; flex-direction:column;
        background:var(--panel); border:1px solid var(--line); border-radius:10px;
        overflow:hidden}
.of-man .dau{display:flex; align-items:center; gap:8px; padding:6px 10px;
             border-bottom:1px solid var(--line); font-size:10.5px;
             text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
             font-weight:700; flex:0 0 auto}
.of-man .dau .ten{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
                  text-transform:none; letter-spacing:0; font-weight:400; font-size:11.5px}
.of-khung-v{position:relative; flex:1 1 0; min-height:0; background:#000}
.of-khung-v video, .of-khung-v img{position:absolute; inset:0; width:100%; height:100%;
                                    object-fit:contain}
.of-khung-v .rong{position:absolute; inset:0; display:grid; place-items:center;
                  color:var(--muted); font-size:12.5px; text-align:center; padding:12px}
/* CỬA SỔ REVIEW+TRIM: to gần trọn màn, mở bằng double-click ứng viên */
#of-trim-cs{position:fixed; inset:0; background:rgba(0,0,0,.78); display:none;
            place-items:center; z-index:80; padding:3vh 3vw}
#of-trim-cs.mo{display:grid}
#of-trim-cs .hop{width:min(1200px, 92vw); height:min(86vh, 780px); display:flex;
                 flex-direction:column; background:var(--panel);
                 border:1px solid var(--line); border-radius:14px; overflow:hidden}
/* ═══ KHAY TRA CỨU PA B (việc E, user chốt 09/09) ═══
   Số đo lấy TỪ MOCKUP `scratchpad/ui_o_tra_cuu.html` khối #pa-B, không tự đặt.
   Cột "Tương tự" cũ BỎ: nó chỉ là tra Library bằng từ khoá rút từ tiêu đề —
   khay này làm được đúng thế và hơn (gõ từ khoá bất kỳ, lọc nguồn, phân trang),
   nên bỏ không mất chức năng nào. */
#of-trim-cs .tren{flex:0 0 236px; display:flex; min-height:0;
                  border-bottom:1px solid var(--line)}
#of-rv-meta{flex:0 0 254px; border-left:1px solid var(--line); padding:11px 13px;
            background:var(--panel2, var(--bg)); font-size:11px; color:var(--muted);
            display:flex; flex-direction:column; gap:7px; overflow-y:auto}
#of-rv-meta h5{margin:0; font-size:11.5px; color:var(--fg); line-height:1.4}
#of-rv-meta .d{display:flex; gap:8px}
#of-rv-meta .d i{color:#5c6875; flex:0 0 60px; font-style:normal}
#of-tim-boc{flex:1 1 0; display:flex; flex-direction:column; min-height:0;
            background:var(--panel2, var(--bg))}
#of-tim-tra{flex:0 0 auto; padding:9px 11px 0}
#of-tim-hang1{display:flex; align-items:center; gap:9px}
#of-tim-hang1 .o{position:relative; flex:1 1 0}
#of-tim{width:100%; box-sizing:border-box; padding:6px 26px 6px 10px; font-size:11.5px}
/* icon kính lúp: mockup dùng 🔍 nhưng đó là EMOJI NHIỀU MÀU — trái nguyên tắc
   thiết kế đã chốt (ký tự đơn sắc). Dùng ⌕ (U+2315) cùng ý nghĩa, một màu. */
#of-tim-hang1 .o .kinh{position:absolute; right:9px; top:5px; color:var(--muted);
                       font-size:13px; pointer-events:none}
#of-tim-loc{display:flex; flex-wrap:wrap; gap:5px; padding:8px 0 9px}
#of-tim-loc .nut{font-size:10.5px; padding:3px 9px; border-radius:20px;
                 border:1px solid var(--line); background:var(--bg);
                 color:var(--muted); cursor:pointer}
#of-tim-loc .nut.on{border-color:var(--accent); color:var(--accent)}
#of-tim-luoi{flex:1 1 0; overflow-y:auto; padding:2px 11px 12px; display:grid;
             grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px;
             align-content:start}
#of-tim-luoi .the{border:1px solid var(--line); border-radius:8px; overflow:hidden;
                  cursor:pointer; background:#000; position:relative}
#of-tim-luoi .the:hover{border-color:var(--accent)}
#of-tim-luoi .the.dang{border-color:var(--accent);
                       box-shadow:0 0 0 1px var(--accent) inset}
#of-tim-luoi .the .im{aspect-ratio:16/9; position:relative}
#of-tim-luoi .the .im img{width:100%; height:100%; object-fit:cover; display:block}
#of-tim-luoi .the .n{font-size:9.5px; padding:3px 6px; color:var(--muted);
                     line-height:1.3; display:-webkit-box; -webkit-line-clamp:2;
                     -webkit-box-orient:vertical; overflow:hidden}
/* nền do THẺ đặt inline theo `OF_TIM_MAU` — không ép ở đây, không thì mọi
   nguồn một màu và huy hiệu nguồn thành vô nghĩa */
#of-tim-luoi .cd{position:absolute; left:4px; top:4px; font-size:8.5px;
                 font-weight:700; padding:1px 5px; border-radius:4px;
                 color:#08210f; z-index:2}
#of-tim-luoi .gio{position:absolute; right:4px; bottom:4px; font-size:9px;
                  padding:1px 5px; border-radius:4px; background:rgba(0,0,0,.66);
                  color:#dfe6ee; z-index:2}
#of-tim-luoi .dd{position:absolute; right:4px; top:4px; font-size:8.5px;
                 padding:1px 5px; border-radius:4px; background:var(--warn);
                 color:#231a05; z-index:2}
#of-tim-luoi .trong{grid-column:1/-1; text-align:center; color:var(--muted);
                    font-size:11.5px; padding:26px 0}
#of-tim-trang{display:flex; align-items:center; justify-content:center; gap:9px;
              grid-column:1/-1; padding:4px 0 2px; font-size:11px;
              color:var(--muted)}
#of-trim-cs .dau{display:flex; align-items:center; gap:10px; padding:10px 14px;
                 border-bottom:1px solid var(--line); font-size:13.5px}
/* thanh trim */
#of-trim{flex:0 0 auto; padding:10px 14px 13px; border-top:1px solid var(--line)}
#of-trim-thanh{position:relative; height:34px; background:var(--bg);
               border:1px solid var(--line); border-radius:6px; cursor:pointer}
#of-trim-vung{position:absolute; top:0; bottom:0; background:var(--accent-soft);
              border-left:2px solid var(--accent); border-right:2px solid var(--accent)}
#of-trim-thanh .tay{position:absolute; top:-2px; bottom:-2px; width:9px;
                    background:var(--accent); border-radius:3px; cursor:ew-resize}
#of-trim-ph{position:absolute; top:0; bottom:0; width:2px; background:var(--warn)}
#of-trim-hang{display:flex; align-items:center; gap:7px; margin-top:7px; font-size:11.5px;
              color:var(--muted)}
#of-trim-hang .btn{padding:4px 10px; font-size:12px}
#of-tl{flex:0 0 auto}
#of-trai{flex:0 0 320px; display:flex; flex-direction:column; gap:9px}

#of-khung .rong{position:absolute; inset:0; display:grid; place-items:center;
                color:var(--muted); font-size:13px; text-align:center; line-height:1.6}
#of-nhan{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
         white-space:nowrap; text-transform:none; letter-spacing:0;
         font-weight:400; font-size:11.5px; color:var(--muted)}
#of-loi-p{flex:1; overflow:auto; background:var(--panel); border:1px solid var(--line);
          border-radius:10px; padding:9px 12px; min-height:0}
#of-cau{font-size:14px}
.of-loi-en{font-size:15.5px; line-height:1.65; color:var(--text)}
.of-loi-vi{font-size:14px; line-height:1.65; color:var(--muted); margin-top:12px;
           padding-top:11px; border-top:1px solid var(--line)}
#of-lop{margin-top:6px; display:flex; gap:5px; flex-wrap:wrap; font-size:11.5px}
.of-chip{background:rgba(105,174,224,.14); color:#69aee0; border-radius:999px; padding:1px 10px}
.of-chip.l1{background:rgba(217,164,65,.15); color:var(--warn)}
.of-chip.l3{background:rgba(138,147,160,.14); color:var(--muted)}
#of-hd{flex:1; display:grid; place-items:center; color:var(--muted);
       border:1px dashed var(--line); border-radius:12px; text-align:center; line-height:1.9}
#of-khay{display:contents}
#of-hd{grid-column:2 / -1; display:grid; place-items:center; color:var(--muted);
       border:1px dashed var(--line); border-radius:12px; text-align:center; line-height:1.9}
/* MỘT POOL (user chốt 13/09): "tách 3 phần ref/envato/PP không có ý nghĩa vì
   sâu bên trong cũng có nút sorting rồi. Gộp chung 1 pool, video phù hợp đưa lên
   trước, không phù hợp cho ra sau." Thứ tự do `xep_3_tang` (A+C+B+còn) quyết —
   JS KHÔNG sắp lại. Số đo lấy từ mockup `scratchpad/ui_mot_pool.html`. */
#of-canh-bao{grid-column:2 / -1; align-self:start; background:var(--bad-soft);
             border:1px solid var(--bad); border-radius:8px; padding:7px 10px;
             font-size:11.5px; line-height:1.55; color:var(--bad)}
#of-canh-bao .nhay{cursor:pointer; text-decoration:underline; text-underline-offset:2px;
                   color:var(--bad); font-weight:700}
#of-canh-bao .nhay:hover{color:var(--text)}
#of-canh-bao b.dau{display:block; text-transform:uppercase; letter-spacing:.06em;
               font-size:10px; margin-bottom:3px}
#of-khay-1{grid-column:2 / -1}
#of-pool{flex:1 1 0; min-height:0; display:grid; gap:8px; overflow-y:auto;
         overflow-x:hidden; align-content:start;
         grid-template-columns:repeat(auto-fill, minmax(132px, 1fr))}
#of-tally{font-size:9.5px; color:var(--muted); display:flex; gap:5px; flex-wrap:wrap;
          align-items:center; margin:0 0 6px}
#of-tally b{color:var(--text)}
#of-tally .sep{width:1px; height:11px; background:var(--line)}
/* vạch ranh: dưới vạch là hàng MÁY KHÔNG TỰ LẤY (tầng B để trống, chốt 13/09) */
#of-pool .moc{grid-column:1 / -1; font-size:9.5px; color:var(--muted); margin-top:2px;
              border-top:1px dashed var(--line); padding-top:5px}

.of-khu{display:flex; flex-direction:column; min-height:0; background:var(--panel);
        border:1px solid var(--line); border-radius:10px; padding:6px 9px}
.of-khu h4{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em;
           display:flex; gap:7px; align-items:center; margin:0 0 5px}
.of-khu h4 .g{flex:1; height:1px; background:var(--line)}
.of-cuon{flex:1 1 0; min-height:0; display:flex; flex-direction:column; gap:8px;
         overflow-y:auto; overflow-x:hidden; align-items:stretch}
.of-uv{flex:0 0 auto; position:relative; border:1px solid var(--line); border-radius:8px;
       overflow:hidden; cursor:pointer; background:#000}

.of-uv .cap{position:relative; aspect-ratio:16/9; background:#000}
.of-uv .cap img,.of-uv .cap video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.of-uv .cap video{opacity:0}
.of-uv:hover .cap video{opacity:1}
.of-uv .n{font-size:9.5px; padding:3px 6px; color:var(--muted); white-space:nowrap;
          overflow:hidden; text-overflow:ellipsis}
.of-uv.dang{border-color:var(--warn); box-shadow:0 0 0 1px var(--warn) inset}
.of-uv .dangn{position:absolute; left:0; right:0; top:0; background:var(--accent);
              color:#fff; font-size:9.5px; font-weight:700; letter-spacing:.05em;
              padding:2px 4px; text-align:center}
/* NHÃN TẦNG (QĐ15, 12/09): A đúng người + đúng vật · B đúng người · C cảnh cận ·
   – máy không lấy. Nhãn ở góc TRÊN-TRÁI, không chạm "+N bản" (dưới-phải) và
   không chạm "● đang dùng" (dải ngang trên cùng) -> để top 14px. */
/* CHIP NGUỒN: gộp cột rồi thì thẻ phải TỰ nói nó từ kho nào. Góc dưới-trái —
   góc trên là dải "● đang dùng", dưới-phải là "+N bản". */
.of-uv .ng{position:absolute; left:4px; bottom:4px; z-index:3; font-size:8.5px;
           font-weight:700; line-height:1; padding:2px 5px; border-radius:3px;
           color:#08121f; pointer-events:none}
.of-uv .tang{position:absolute; left:3px; top:14px; z-index:3; font-size:9px;
             font-weight:700; line-height:1; padding:2px 4px; border-radius:3px;
             color:#fff; background:#6b7280}
.of-uv .tA{background:#1b7f3b}
.of-uv .tB{background:#1f6feb}
.of-uv .tC{background:#b26a00}
.of-uv.mo{opacity:.45}
.of-uv.mo:hover{opacity:1}
.of-uv .lap{position:absolute; inset:0; background:rgba(224,108,108,.26);
            display:grid; place-items:center; font-size:10px; color:#fff; font-weight:600; z-index:2}
/* "+N bản": clip cùng nguồn cùng tiêu đề đã gộp về một thẻ (user chốt 09/09).
   Không phải cảnh báo — chỉ cho biết còn bản khác, mở review là đổi được. */
.of-uv .ban{position:absolute; right:4px; bottom:4px; font-size:9px; z-index:2;
            background:rgba(0,0,0,.74); color:var(--muted); padding:1px 6px;
            border-radius:4px; pointer-events:none}
#of-vung-tl{display:flex}
#of-track-nhan{flex:0 0 30px; padding-top:2px}
#of-track-nhan .o{display:grid; place-items:center; font-size:11px; font-weight:700;
                  color:var(--muted); border-right:1px solid var(--line);
                  letter-spacing:.04em}
#of-cuon-tl{overflow-x:auto; padding:2px 2px 8px; flex:1; min-width:0}
/* thước kiểu NLE (ref Premiere, user 06/09): tick lớn/nhỏ vẽ bằng gradient,
   kéo trên thước = scrub playhead */
#of-thuoc{position:relative; height:24px; cursor:col-resize; margin-bottom:10px;
          border-bottom:1px solid var(--line); user-select:none}
#of-thuoc span{position:absolute; top:1px; font-size:11.5px; color:var(--muted)}
/* mỗi track một LÀN nền riêng, cách nhau rõ (user 06/09: "dính liền khó nhìn") */
#of-dai{position:relative; height:78px; background:var(--bg); border-radius:6px}
#of-dai-au{position:relative; height:48px; margin-top:12px; background:var(--bg);
           border-radius:6px}
#of-dai-nh{position:relative; height:26px; margin-top:8px; background:var(--bg);
           border-radius:6px; cursor:pointer}
.of-nh{position:absolute; top:0; height:100%; border-radius:6px; overflow:hidden;
       background:color-mix(in srgb, var(--accent) 22%, var(--panel));
       border:1px solid var(--accent); display:flex; align-items:center}
.of-nh span{font-size:10.5px; color:var(--text); padding:0 8px; white-space:nowrap;
            overflow:hidden; text-overflow:ellipsis}
.of-nh.lap{opacity:.75}
#of-dai-nh .rong{position:absolute; inset:0; display:grid; place-items:center;
                 font-size:10.5px; color:var(--muted); border:1px dashed var(--line);
                 border-radius:6px}
.of-au{position:absolute; top:0; height:100%; border-radius:6px; box-sizing:border-box;
       background:var(--panel); border:1px solid var(--line); overflow:hidden}
.of-au .t{position:absolute; left:6px; right:4px; top:50%; transform:translateY(-50%);
          font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden;
          max-width:94%}
.of-au.chon{outline:2px solid var(--warn); outline-offset:-2px}
/* MỘT TIMELINE CHO CẢ TẬP (QĐ17, 17/09): nhãn chương ở đầu MỖI khối + vạch ranh chương */
.of-au .ch{position:absolute; left:0; top:0; bottom:0; width:26px; display:grid; place-items:center;
           font-size:11px; font-weight:800; letter-spacing:.03em; background:rgba(217,164,65,.16);
           color:var(--warn); border-right:1px solid var(--line)}
.of-au.co-ch .t{left:32px}
.of-ranh{position:absolute; top:-92px; bottom:-2px; width:2px; background:var(--warn); opacity:.9;
         z-index:3; pointer-events:none}

   thắng. Đặt trước là `.tho` đè mất viền đỏ ở mọi miếng trong khoảng thở —
   user nghiệm thu 09/09 báo "có báo lỗi nhưng không có viền đỏ" đúng vì vậy. */
/* Viền + phủ đỏ NHẠT toàn miếng: đo thật 09/09 trên timeline 14px/s, miếng hẹp
   nhất chỉ 22px — chỉ viền 1px thì lướt qua là không thấy. Phủ nền để nhận ra
   từ xa, không cần đọc chữ. */

               background:var(--bad-soft)}
.of-mieng.hong img{opacity:.35}          /* dìm hình để màu đỏ nổi lên */
.of-mieng.hong::after{content:"clip hỏng"; position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%); font-size:10px; font-weight:700; color:#fff;
  background:var(--bad); padding:2px 7px; border-radius:5px; z-index:3;
  white-space:nowrap; pointer-events:none;
  max-width:calc(100% - 6px); overflow:hidden}

@container (max-width: 62px) { .of-mieng.hong::after{content:"✕"; padding:1px 5px} }
